[project]
name = "nursing-draft-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "SIM", "RUF"]
ignore = [
  "D100", "D104", "D105", "D107",  # モジュール・パッケージ・特殊メソッドの docstring は必須にしない
  "D203", "D213",                  # Google スタイルに合わせる
  "D415", "D400",                  # 日本語の文末は「。」
  "RUF001", "RUF002", "RUF003",    # 全角の記号（：、（）など）を使う
  "B008",                          # FastAPI の Depends() を引数の既定値に書く
  "D403",                          # 先頭の英単語（live・client）を大文字にしない
  "E501",                          # 行の長さはフォーマッタに任せる（プロンプトの文は折らない）
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
